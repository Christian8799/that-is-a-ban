# that-s-a-ban configuration
config-version: 5

layer2:
  marker-permission: "thatsaban.layer2"
  negated-permissions:
    - "foxav.bypass"
    - "handshaker.bypass"
  exempt-permission: "thatsaban.exempt"

offend:
  kick-online-target: false

reports:
  enabled: true
  cooldown-seconds: 60
  max-reason-length: 200
  # FlashbackServer clips.window-seconds must be at least this value.
  # FlashbackServer retains two keyframe segments, so the saved clip may be longer.
  minimum-clip-window-seconds: 60

privacy:
  # Optional absolute path outside the plugin directory; empty = plugins/ThatsABan/ip-hmac.key.
  # The THATSABAN_HMAC_KEY_PATH environment variable takes precedence.
  hmac-key-path: ""
  # Do not write player-related audit entries to Paper logs by default.
  # When enabled, only UUIDs are logged (no player names or IP addresses).
  audit-logging: false

bedrock:
  name-prefixes:
    - "."

country-filter:
  enabled: true
  database-file: "geoip/IP2LOCATION-LITE-DB3.IPV6.BIN"
  allowed-region-names:
    - "Bayern"
    - "Bavaria"
  allow-private-addresses: false

# Privacy-friendly defaults: IP linking remains disabled.
alt-detection:
  enabled: false
  retention-days: 30
  offender-retention-days: 365 # Finite retention period since last activity; maximum 3650 days
  auto-apply: false # false = staff suggestions only; /offend requires deliberate confirmation
  retroactive: false # Do not automatically classify previously known IP matches retroactively
  ignore-private-addresses: true
  ignored-ips: []

integrations:
  layer1-plugins:
    - "GrimAC"
    - "CheatDetector"
  layer2-plugins:
    - "FoxGate"
    - "HandShaker"

# Select the language used by player messages and plugin logs.
# Supported values: en, de
language: en

messages:
  en:
    prefix: "<gray>[<red>that-s-a-ban</red>]</gray> "
    usage: "<red>Usage: /offend <player>"
    player-not-found: "<red>Player <white><player></white> is not known to this server."
    bedrock-immune: "<yellow><player></yellow> is a Bedrock player and is immune to /offend."
    exempt: "<yellow><player></yellow> is exempt (thatsaban.exempt)."
    already: "<yellow><player></yellow> is already in Layer 2."
    done: "<green><player></green> was moved to <red>Layer 2</red>."
    done-alts: "<gray>Also automatically moved to Layer 2: <white><alts></white>"
    error: "<red>Could not apply Layer 2. Check the console."
    kick-relogin: "<red>Your security level has changed. Please reconnect."
    alt-suggestion-staff: "<yellow>Review required:</yellow> <white><player></white> shares a flagged IP. Review the context before taking action; if confirmed, use /offend <player>."
    alt-auto-applied-staff: "<red>Automatic action:</red> <white><player></white> was moved to Layer 2 due to an IP match."
    country-denied: "<red>Connections are only allowed from an IP address in Bavaria."
    country-lookup-failed: "<red>Your IP address could not be geolocated locally. Please try again later."
