name: ThatsABan
main: io.github.christian8799.thatsaban.ThatsABan
version: ${version}
api-version: "1.21.11"
author: Christian8799
description: Anti-Cheat-Connector with privacy tools and protected admin spectating
softdepend: [LuckPerms, ProtocolLib, GrimAC, CheatDetector, FoxGate, HandShaker, Geyser-Spigot, floodgate]
softdepend: [GrimAC, CheatDetector, FoxGate, HandShaker, Geyser-Spigot, floodgate]

commands:
  offend:
    description: Versetzt einen Spieler nach Staff-Entscheidung in Layer 2
    usage: /<command> <Spieler>
    permission: thatsaban.offend
  thatsaban:
    description: Datenschutz-Auskunft, Account-Netzwerk, Layer-2-Entfernung und Datenlöschung
    usage: /<command> <info|network|unoffend|forget> <Spieler|UUID> [depth|confirm]
  adminspec:
    description: Geschützte Admin-Beobachtung verwalten
    usage: /<command> <observe|off|permanent> [Spieler]
    permission: thatsaban.spectator

permissions:
  thatsaban.admin:
    description: Übergeordnete Berechtigung für Datenschutz-Administrationsbefehle
    default: op
  thatsaban.offend:
    description: Darf /offend benutzen
    default: op
  thatsaban.privacy.read:
    description: Darf gespeicherte Plugin-Daten zu einem Spieler abfragen
    default: op
  thatsaban.layer2.remove:
    description: Darf Layer 2 und den Offender-Eintrag eines Spielers entfernen
    default: op
  thatsaban.privacy.erase:
    description: Darf Plugin-Daten eines Spielers vollständig löschen
    default: op
  thatsaban.network:
    description: Darf das gespeicherte Alt-Account-Netzwerk einsehen
    default: op
  thatsaban.view-linked-accounts:
    description: Darf Namen von Accounts mit gemeinsamer IP-Verknüpfung sehen
    default: op
  thatsaban.notify:
    description: Erhält Hinweise zu IP-Übereinstimmungen, die Staff prüfen soll
    default: op
  thatsaban.layer2:
    description: Marker-Node für Layer 2
    default: false
  thatsaban.exempt:
    description: Ausnahme von /offend und IP-Kopplung
    default: false
  thatsaban.spectator:
    description: Darf geschützte Admin-Beobachtung verwenden
    default: op
  thatsaban.spectator.permanent:
    description: Darf permanente Spectator-Accounts verwalten
    default: op
    children:
      thatsaban.spectator: true
