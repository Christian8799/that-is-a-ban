name: ThatsABan
main: io.github.christian8799.thatsaban.ThatsABan
version: ${version}
api-version: "26.3"
author: Christian8799
description: Anti-Cheat-Connector - Layer 1/2, /offend, IP-Kopplung, Bedrock-Immunitaet, LuckPerms
depend: [LuckPerms]
softdepend: [GrimAC, CheatDetector, FoxGate, HandShaker, Geyser-Spigot, floodgate]

commands:
  offend:
    description: Versetzt einen Spieler dauerhaft in Layer 2 des Anti-Cheats
    usage: /<command> <Spieler>
    permission: thatsaban.offend

permissions:
  thatsaban.offend:
    description: Darf /offend benutzen
    default: op
  thatsaban.notify:
    description: Erhaelt Meldungen, wenn ein Account automatisch in Layer 2 versetzt wird
    default: op
  thatsaban.layer2:
    description: Marker-Node fuer Layer 2 (wird per LuckPerms gesetzt)
    default: false
  thatsaban.exempt:
    description: Ausnahme - kann nicht per /offend oder IP-Kopplung in Layer 2 landen
    default: false
