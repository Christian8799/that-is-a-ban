name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: build/libs/*.jar

  paper-smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: plugins
      - name: Download Paper 1.21.11 and LuckPerms
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          LP_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" https://metadata.luckperms.net/data/downloads | jq -er '.downloads.bukkit')"
          curl -fL "$PAPER_URL" -o paper.jar
          curl -fL "$LP_URL" -o plugins/LuckPerms.jar
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties
      - name: Start Paper and verify plugin enablement
        run: |
          set -euo pipefail
          java -Xms512M -Xmx1G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if grep -q "Done (" server.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done
          cat server.log
          grep -q "Enabling LuckPerms v" server.log
          grep -q "Enabling ThatsABan v" server.log
          grep -q "Done (" server.log
          if grep -E "Could not load 'plugins/ThatsABan|Error occurred while enabling ThatsABan" server.log; then
            echo "ThatsABan failed to load."
            exit 1
          fi
