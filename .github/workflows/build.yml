name: Build

on:
  # Validate pull-request updates and main pushes. Branch push and PR runs share a concurrency group.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        id: jdk21
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v5
        id: jdk25
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.3
      - name: Build embedded replay engine and all version adapters
        run: gradle build --no-daemon -Dorg.gradle.java.installations.paths="${{ steps.jdk21.outputs.path }},${{ steps.jdk25.outputs.path }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ThatsABan-multiversion
          path: build/libs/*.jar

  paper-integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        id: jdk25
        with:
          distribution: temurin
          # FoxGate-Free.jar and Paper 26.x adapters require Java 25.
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-multiversion
          path: plugins

      - name: Download Paper, LuckPerms and ProtocolLib
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          LP_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" https://metadata.luckperms.net/data/downloads | jq -er '.downloads.bukkit')"
          # Maven publishes a platform-neutral library, not the installable Paper plugin.
          # Use the official modern Paper plugin asset from ProtocolLib's dev-build release.
          PROTOCOLLIB_URL="https://github.com/dmulloy2/ProtocolLib/releases/download/dev-build/ProtocolLib.jar"

          curl --fail --location --retry 3 "$PAPER_URL" -o paper.jar
          curl --fail --location --retry 3 "$LP_URL" -o plugins/LuckPerms.jar
          curl --fail --location --retry 3 "$PROTOCOLLIB_URL" -o plugins/ProtocolLib.jar

          test -s paper.jar
          test -s plugins/LuckPerms.jar
          test -s plugins/ProtocolLib.jar

          # ProtocolLib's modern Paper artifact uses paper-plugin.yml; the
          # Spigot-compatible artifact uses plugin.yml. Accept either descriptor.
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re

          with ZipFile(Path("plugins/ProtocolLib.jar")) as archive:
              descriptors = [
                  name for name in ("paper-plugin.yml", "plugin.yml")
                  if name in archive.namelist()
              ]
              if not descriptors:
                  raise SystemExit(
                      "Official ProtocolLib JAR has neither paper-plugin.yml nor plugin.yml"
                  )
              descriptor = "\n".join(
                  archive.read(name).decode("utf-8", "replace")
                  for name in descriptors
              )

          name_line = next(
              (line for line in descriptor.splitlines() if line.startswith("name:")),
              "",
          )
          actual = name_line.partition(":")[2].strip().strip("'").strip('"')
          if actual != "ProtocolLib":
              raise SystemExit("Downloaded JAR is not the ProtocolLib Paper/Spigot plugin")
          print(f"Verified ProtocolLib plugin descriptor: {', '.join(descriptors)}")
          PY

      - name: Download integration plugins from official Modrinth releases
        env:
          MODRINTH_USER_AGENT: "ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
        run: |
          set -euo pipefail

          # Resolve current official Modrinth files for Paper + Minecraft 1.21.11.
          # No third-party mirrors, temporary share links, or user-hosted archives.
          download_modrinth_plugin() {
            local project="$1"
            local expected_name="$2"
            local version_json file_url file_name
            version_json="$(curl --fail --silent --show-error --location --retry 3 \
              -H "User-Agent: $MODRINTH_USER_AGENT" \
              --get "https://api.modrinth.com/v2/project/$project/version" \
              --data-urlencode 'loaders=["paper"]' \
              --data-urlencode 'game_versions=["1.21.11"]')"
            file_url="$(jq -er 'first(.[] | .files[] | select(.primary == true) | .url)' <<< "$version_json")"
            file_name="$(jq -er 'first(.[] | .files[] | select(.primary == true) | .filename)' <<< "$version_json")"
            curl --fail --silent --show-error --location --retry 3 "$file_url" -o "plugins/$file_name"
            test -s "plugins/$file_name"
            printf '%s\t%s\n' "$expected_name" "plugins/$file_name" >> integration-plugin-map.txt
            echo "Downloaded $expected_name from official Modrinth project '$project': $file_name"
          }

          : > integration-plugin-map.txt
          download_modrinth_plugin "grimac" "GrimAC"
          download_modrinth_plugin "cheat-detector" "CheatDetector"
          download_modrinth_plugin "foxgate" "FoxGate"
          download_modrinth_plugin "hand-shaker" "HandShaker"

          # Verify the official downloads actually contain the expected plugin IDs.
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re

          expected = {
              "GrimAC": {"grimac"},
              "CheatDetector": {"cheatdetector", "cheat detector"},
              "FoxGate": {"foxgate"},
              "HandShaker": {"handshaker", "hand shaker"},
          }

          for line in Path("integration-plugin-map.txt").read_text().splitlines():
              plugin, jar_path = line.split("\t", 1)
              jar = Path(jar_path)
              if not jar.is_file() or jar.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty plugin JAR: {jar}")

              with ZipFile(jar) as archive:
                  descriptors = [
                      name for name in ("plugin.yml", "paper-plugin.yml")
                      if name in archive.namelist()
                  ]
                  if not descriptors:
                      raise SystemExit(f"{jar.name} has no Paper/Bukkit plugin descriptor")
                  descriptor = "\n".join(
                      archive.read(name).decode("utf-8", "replace")
                      for name in descriptors
                  )

              name_line = next(
                  (line for line in descriptor.splitlines() if line.startswith("name:")),
                  "",
              )
              if not name_line:
                  raise SystemExit(f"Could not read plugin name from {jar.name}")

              actual = name_line.partition(":")[2].strip().strip("'").strip('"').lower()
              if actual not in expected[plugin]:
                  raise SystemExit(
                      f"{jar.name}: expected {plugin}, descriptor declares {actual!r}"
                  )
              print(f"Verified {plugin}: {jar.name}")
          PY

          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties

      - name: Start Paper and verify every plugin
        env:
          JAVA25_HOME: ${{ steps.jdk25.outputs.path }}
        run: |
          set -euo pipefail
          "$JAVA25_HOME/bin/java" -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 180); do
            if grep -q "Done (" server.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done

          cat server.log
          grep -q "Done (" server.log
          grep -q "Embedded Flashback adapter loaded for Minecraft 1.21.11." server.log
          grep -q "Report system initialized with embedded 60-second Flashback replay buffers." server.log
          grep -q "ProtocolLib integration enabled: admin spectator mode is available." server.log

          for plugin in LuckPerms ProtocolLib ThatsABan GrimAC CheatDetector FoxGate HandShaker; do
            if ! grep -Ei "(Loading server plugin|Enabling) ${plugin}([[:space:]]| v)" server.log; then
              echo "Plugin did not reach its loading/enabling stage: $plugin"
              exit 1
            fi
          done

          if grep -Ei "Could not load .*plugins/|Error occurred while enabling|Unsupported API version|InvalidPluginException" server.log; then
            echo "At least one test plugin failed to load or enable."
            exit 1
          fi

          echo "Paper 1.21.11 started with all requested integration plugins."

  paper-26-3-embedded-replay-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        id: jdk25
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-multiversion
          path: plugins
      - name: Download Paper 26.3
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-Embedded-Replay-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/26.3/builds?limit=1" | jq -er 'first(.[] | .downloads["server:default"].url)')"
          curl --fail --location --retry 3 "$PAPER_URL" -o paper.jar
          test -s paper.jar
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\\nserver-port=25565\\n' > server.properties
      - name: Start Paper and verify the embedded 26.3 adapter
        env:
          JAVA25_HOME: ${{ steps.jdk25.outputs.path }}
        run: |
          set -euo pipefail
          "$JAVA25_HOME/bin/java" -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 180); do
            if grep -q "Done (" server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then cat server.log; exit 1; fi
            sleep 2
          done
          cat server.log
          grep -q "Done (" server.log
          grep -q "Enabling ThatsABan" server.log
          grep -q "Embedded Flashback adapter loaded for Minecraft 26.3" server.log
          grep -q "Report system initialized with embedded 60-second Flashback replay buffers." server.log
          if grep -Ei "NoClassDefFoundError.*zeffut|Could not load .*ThatsABan|Error occurred while enabling ThatsABan" server.log; then
            echo "Embedded Flashback 26.3 adapter failed to load."
            exit 1
          fi

  optional-dependency-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-multiversion
          path: plugins
      - name: Download Paper without optional integrations
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-Optional-Dependency-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          curl --fail --location --retry 3 "$PAPER_URL" -o paper.jar
          test -s paper.jar
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties
      - name: Verify ThatsABan starts without LuckPerms or ProtocolLib
        run: |
          set -euo pipefail
          java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 180); do
            if grep -q "Done (" server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done

          cat server.log
          grep -q "Done (" server.log
          grep -q "Enabling ThatsABan" server.log
          grep -q "LuckPerms-Integration (Layer 2, /offend, /thatsaban) was disabled" server.log
          grep -q "Admin-Spectator (ProtocolLib) was disabled" server.log
          grep -q "Embedded Flashback adapter loaded for Minecraft 1.21.11." server.log
          grep -q "Report system initialized with embedded 60-second Flashback replay buffers." server.log
          grep -q "ThatsABan enabled. Optional integrations were initialized independently." server.log

          if grep -Ei "Error occurred while enabling ThatsABan|Could not load .*ThatsABan|NoClassDefFoundError.*(luckperms|com/comphenix)" server.log; then
            echo "ThatsABan failed while optional dependencies were absent."
            exit 1
          fi

          echo "ThatsABan started successfully with LuckPerms and ProtocolLib absent."
