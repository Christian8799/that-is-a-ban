name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: build/libs/*.jar

  paper-integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: plugins
      - name: Download Paper, LuckPerms and integration plugins
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          LP_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" https://metadata.luckperms.net/data/downloads | jq -er '.downloads.bukkit')"
          curl -fL "$PAPER_URL" -o paper.jar
          curl -fL "$LP_URL" -o plugins/LuckPerms.jar

          # The Dropbox folder is downloaded as an outer ZIP. GrimAC is
          # itself a ZIP inside that bundle and may contain further archives.
          DROPBOX_FOLDER_URL="https://www.dropbox.com/scl/fo/pydnwzw2cxvpj0bxzbj86/AE9rDURI9JqcY3Dauw5V2B4?rlkey=x0k209tuuelcsel0nxt0shmmb&st=g4zv21a1&dl=1"
          curl --fail --location --retry 3 "$DROPBOX_FOLDER_URL" -o integration-bundle.zip
          mkdir -p integration-bundle integration-unpacked integration-unpacked/.processed
          unzip -q integration-bundle.zip -d integration-bundle

          # Recursively extract every nested ZIP (including grimac-bukkit.zip).
          # Move processed archives out of the search tree to prevent loops.
          while true; do
            mapfile -d '' archives < <(find integration-bundle integration-unpacked \
              -type f -iname '*.zip' ! -path '*/.processed/*' -print0)
            [ "${#archives[@]}" -gt 0 ] || break
            for archive in "${archives[@]}"; do
              echo "Extracting nested archive: $archive"
              unzip -oq "$archive" -d integration-unpacked
              mv "$archive" "integration-unpacked/.processed/$(basename "$archive")"
            done
          done

          # Use the freshly built ThatsABan JAR, not any copy in the bundle.
          find integration-bundle integration-unpacked -type f -name '*.jar' \
            ! -path '*/.processed/*' \
            ! -iname 'paper*.jar' \
            ! -iname 'thatsaban*.jar' \
            -print -exec cp -f {} plugins/ \;

          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties
          echo "Installed test plugins:"
          find plugins -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort

      - name: Start Paper and verify all plugins
        run: |
          set -euo pipefail
          java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if grep -q "Done (" server.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done
          cat server.log
          grep -q "Enabling LuckPerms v" server.log
          grep -q "Enabling ThatsABan v" server.log
          grep -q "Done (" server.log

          if grep -Ei "Could not load .*plugins/|Error occurred while enabling|Unsupported API version|InvalidPluginException" server.log; then
            echo "At least one test plugin failed to load or enable."
            exit 1
          fi

          echo "Paper startup completed with the integration bundle."
