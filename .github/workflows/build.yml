name: Build

on:
  # PRs are validated on every update. Push validation is reserved for main,
  # avoiding duplicate builds for commits on an open pull-request branch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: build/libs/*.jar

  paper-integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # FoxGate-Free.jar was compiled for Java 25 (class-file version 69).
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: plugins

      - name: Download Paper, LuckPerms and ProtocolLib
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          LP_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" https://metadata.luckperms.net/data/downloads | jq -er '.downloads.bukkit')"
          PROTOCOLLIB_METADATA_URL="https://repo.dmulloy2.net/repository/public/net/dmulloy2/ProtocolLib/5.5.0-SNAPSHOT/maven-metadata.xml"
          PROTOCOLLIB_METADATA="$(curl -fsSL --retry 3 "$PROTOCOLLIB_METADATA_URL")"
          PROTOCOLLIB_VERSION="$(python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.fromstring(sys.stdin.read()); ns={"m":"http://maven.apache.org/POM/4.0.0"}; items=root.findall(".//m:snapshotVersion", ns); item=next(x for x in items if x.findtext("m:extension", namespaces=ns)=="jar" and x.find("m:classifier", ns) is None); print(item.findtext("m:value", namespaces=ns))' <<< "$PROTOCOLLIB_METADATA")"
          PROTOCOLLIB_URL="https://repo.dmulloy2.net/repository/public/net/dmulloy2/ProtocolLib/5.5.0-SNAPSHOT/ProtocolLib-${PROTOCOLLIB_VERSION}.jar"

          curl --fail --location --retry 3 "$PAPER_URL" -o paper.jar
          curl --fail --location --retry 3 "$LP_URL" -o plugins/LuckPerms.jar
          curl --fail --location --retry 3 "$PROTOCOLLIB_URL" -o plugins/ProtocolLib.jar

          test -s paper.jar
          test -s plugins/LuckPerms.jar
          test -s plugins/ProtocolLib.jar

      - name: Download integration plugins from official Modrinth releases
        env:
          MODRINTH_USER_AGENT: "ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
        run: |
          set -euo pipefail

          # Resolve current official Modrinth files for Paper + Minecraft 1.21.11.
          # No third-party mirrors, temporary share links, or user-hosted archives.
          download_modrinth_plugin() {
            local project="$1"
            local expected_name="$2"
            local version_json file_url file_name
            version_json="$(curl --fail --silent --show-error --location --retry 3 \
              -H "User-Agent: $MODRINTH_USER_AGENT" \
              --get "https://api.modrinth.com/v2/project/$project/version" \
              --data-urlencode 'loaders=["paper"]' \
              --data-urlencode 'game_versions=["1.21.11"]')"
            file_url="$(jq -er 'first(.[] | .files[] | select(.primary == true) | .url)' <<< "$version_json")"
            file_name="$(jq -er 'first(.[] | .files[] | select(.primary == true) | .filename)' <<< "$version_json")"
            curl --fail --silent --show-error --location --retry 3 "$file_url" -o "plugins/$file_name"
            test -s "plugins/$file_name"
            printf '%s\t%s\n' "$expected_name" "plugins/$file_name" >> integration-plugin-map.txt
            echo "Downloaded $expected_name from official Modrinth project '$project': $file_name"
          }

          : > integration-plugin-map.txt
          download_modrinth_plugin "grimac" "GrimAC"
          download_modrinth_plugin "cheat-detector" "CheatDetector"
          download_modrinth_plugin "foxgate" "FoxGate"
          download_modrinth_plugin "hand-shaker" "HandShaker"

          # Verify the official downloads actually contain the expected plugin IDs.
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re

          expected = {
              "GrimAC": {"grimac"},
              "CheatDetector": {"cheatdetector", "cheat detector"},
              "FoxGate": {"foxgate"},
              "HandShaker": {"handshaker", "hand shaker"},
          }

          for line in Path("integration-plugin-map.txt").read_text().splitlines():
              plugin, jar_path = line.split("\t", 1)
              jar = Path(jar_path)
              if not jar.is_file() or jar.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty plugin JAR: {jar}")

              with ZipFile(jar) as archive:
                  descriptors = [
                      name for name in ("plugin.yml", "paper-plugin.yml")
                      if name in archive.namelist()
                  ]
                  if not descriptors:
                      raise SystemExit(f"{jar.name} has no Paper/Bukkit plugin descriptor")
                  descriptor = "\n".join(
                      archive.read(name).decode("utf-8", "replace")
                      for name in descriptors
                  )

              match = re.search(r"(?im)^name:\s*(.+)$", descriptor)
              if not match:
                  raise SystemExit(f"Could not read plugin name from {jar.name}")

              actual = match.group(1).strip().strip("'").strip('"').lower()
              if actual not in expected[plugin]:
                  raise SystemExit(
                      f"{jar.name}: expected {plugin}, descriptor declares {actual!r}"
                  )
              print(f"Verified {plugin}: {jar.name}")
          PY

          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties

      - name: Start Paper and verify every plugin
        run: |
          set -euo pipefail
          java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 180); do
            if grep -q "Done (" server.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done

          cat server.log
          grep -q "Done (" server.log

          for plugin in LuckPerms ProtocolLib ThatsABan GrimAC CheatDetector FoxGate HandShaker; do
            if ! grep -Ei "(Loading server plugin|Enabling) ${plugin}([[:space:]]| v)" server.log; then
              echo "Plugin did not reach its loading/enabling stage: $plugin"
              exit 1
            fi
          done

          if grep -Ei "Could not load .*plugins/|Error occurred while enabling|Unsupported API version|InvalidPluginException" server.log; then
            echo "At least one test plugin failed to load or enable."
            exit 1
          fi

          echo "Paper 1.21.11 started with all requested integration plugins."
