name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: build/libs/*.jar

  paper-integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: ThatsABan-Paper-1.21.11
          path: plugins

      - name: Download Paper, LuckPerms and PacketEvents
        run: |
          set -euo pipefail
          USER_AGENT="ThatsABan-CI/1.0 (https://github.com/Christian8799/that-is-a-ban)"
          PAPER_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds?channel=STABLE&limit=1" | jq -er 'first(.[] | select(.channel == "STABLE") | .downloads["server:default"].url)')"
          LP_URL="$(curl -fsSL -H "User-Agent: $USER_AGENT" https://metadata.luckperms.net/data/downloads | jq -er '.downloads.bukkit')"
          PACKETEVENTS_URL="https://github.com/retrooper/packetevents/releases/download/v2.11.2/packetevents-spigot-2.11.2.jar"

          curl --fail --location --retry 3 "$PAPER_URL" -o paper.jar
          curl --fail --location --retry 3 "$LP_URL" -o plugins/LuckPerms.jar
          curl --fail --location --retry 3 "$PACKETEVENTS_URL" -o plugins/PacketEvents.jar

          test -s paper.jar
          test -s plugins/LuckPerms.jar
          test -s plugins/PacketEvents.jar

      - name: Download and safely extract the integration plugins
        run: |
          set -euo pipefail
          DROPBOX_FOLDER_URL="https://www.dropbox.com/scl/fo/pydnwzw2cxvpj0bxzbj86/AE9rDURI9JqcY3Dauw5V2B4?rlkey=x0k209tuuelcsel0nxt0shmmb&dl=1"
          curl --fail --location --retry 3 --retry-all-errors "$DROPBOX_FOLDER_URL" -o integration-bundle.zip

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import zipfile

          bundle = Path("integration-bundle.zip")
          root = Path("integration-unpacked")
          root.mkdir(exist_ok=True)

          if not zipfile.is_zipfile(bundle):
              raise SystemExit(
                  "Dropbox did not return a ZIP archive. Check the shared-folder "
                  "download link and its download permission."
              )

          def safe_extract(archive: Path, destination: Path) -> None:
              destination.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      name = info.filename.replace("\\", "/")
                      relative = PurePosixPath(name)
                      if relative.is_absolute() or any(part in ("..", "") for part in relative.parts):
                          print(f"Skipping unsafe ZIP entry: {name!r}")
                          continue
                      target = destination.joinpath(*relative.parts)
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, target.open("wb") as output:
                          shutil.copyfileobj(source, output)

          queue = [(bundle, root / "outer")]
          index = 0
          while queue:
              archive, destination = queue.pop(0)
              print(f"Extracting {archive} -> {destination}")
              safe_extract(archive, destination)
              nested = sorted(destination.rglob("*.zip"))
              for child in nested:
                  index += 1
                  queue.append((child, root / f"nested-{index:03d}"))

          wanted = {
              "grimac-bukkit-2.3.74.jar": "GrimAC",
              "CheatDetector-4.4.jar": "CheatDetector",
              "FoxGate-Free.jar": "FoxGate",
              "hand-shaker-paper-7.0.1-1.21_.jar": "HandShaker",
          }
          all_jars = [p for p in root.rglob("*.jar") if p.is_file()]
          by_name = {p.name.lower(): p for p in all_jars}

          for filename, plugin_name in wanted.items():
              source = by_name.get(filename.lower())
              if source is None:
                  raise SystemExit(f"Missing integration JAR: {filename}")
              with zipfile.ZipFile(source) as jar:
                  descriptors = [
                      n for n in ("plugin.yml", "paper-plugin.yml")
                      if n in jar.namelist()
                  ]
                  if not descriptors:
                      raise SystemExit(f"{filename} has no plugin descriptor")
                  descriptor_text = "\n".join(
                      jar.read(n).decode("utf-8", "replace") for n in descriptors
                  )
                  if not any(
                      line.strip().lower() == f"name: {plugin_name.lower()}"
                      or line.strip().lower() == f'name: "{plugin_name.lower()}"'
                      for line in descriptor_text.splitlines()
                  ):
                      raise SystemExit(
                          f"{filename} does not declare plugin name {plugin_name}"
                      )
              shutil.copy2(source, Path("plugins") / filename)
              print(f"Installed {plugin_name}: {source}")

          print("Integration plugin JARs:")
          for path in sorted(Path("plugins").glob("*.jar")):
              print(f" - {path.name} ({path.stat().st_size} bytes)")
          PY

          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\n' > server.properties

      - name: Start Paper and verify every plugin
        run: |
          set -euo pipefail
          java -Xms1G -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 180); do
            if grep -q "Done (" server.log; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              echo "Paper exited before completing startup."
              exit 1
            fi
            sleep 2
          done

          cat server.log
          grep -q "Done (" server.log

          for plugin in LuckPerms PacketEvents ThatsABan GrimAC CheatDetector FoxGate HandShaker; do
            if ! grep -E "(Loading server plugin|Enabling) ${plugin}([[:space:]]| v)" server.log; then
              echo "Plugin did not reach its loading/enabling stage: $plugin"
              exit 1
            fi
          done

          if grep -Ei "Could not load .*plugins/|Error occurred while enabling|Unsupported API version|InvalidPluginException" server.log; then
            echo "At least one test plugin failed to load or enable."
            exit 1
          fi

          echo "Paper 1.21.11 started with all requested integration plugins."
